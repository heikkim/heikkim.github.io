# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

#theme: jekyll-agency
#remote_theme: raviriley/agency-jekyll-theme

DEBUG  : false

url    : "" #"https://localhost:4000" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /posts. Do not set to "/" to avoid wrong canonical meta link path 

title      : "StrongPoint Consulting" # Also check _data/_sitetext.yml for what's visible on the page.
description: Fractional AI Lead, AI coaching and AI consulting agency # This is used only if there is no specific description available for the page
email      : noreply@nop.nop #this is also the email contact forms will go to
author     : Heikki Malkamäki
# logo:     #optional, defaults to site title
  # path: assets\img\clients\creative-market.jpg
  # height: 60 #height in px, defaults to 52px
  # See: nav.html where logo image is built with HTML/CSS

analytics:
  google: G-5HZGV8ZNEF

#collections:
#  portfolio:

markdown: kramdown

# Uncomment following line to use Formspree form ID based URL instead of email based URL
