# ==============================================================
#  Posts
#
#  Posts live in a two level folder structure:
#
#    _posts/<lang>/<category>/YYYY-MM-DD-<slug>.md
#
#  - the first folder picks the language (fi = default, en)
#  - the second folder is the category, and its name is also the
#    category slug of the post
#
#  The defaults below read the language, the layout, the permalink
#  and the category of a post from its folder path. A post can
#  still override any of them in its own front matter.
#
#  The category slug, the date and the file name are language
#  neutral, so a Finnish post and its English counterpart share
#  the same URL apart from the /en prefix. The language chooser
#  relies on that.
# ==============================================================

permalink: /posts/:year/:month/:day/:title:output_ext

defaults:
  # ---- The default language of a post --------------------------
  - scope:
      path: ""
      type: "posts"
    values:
      author: HM
      lang: fi
      layout: post

  # ---- Finnish posts ------------------------------------------
  - scope:
      path: "_posts/fi"
      type: "posts"
    values:
      author: HM
      lang: fi
      layout: post
      permalink: /posts/:year/:month/:day/:title/

  # ---- English posts ------------------------------------------
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      author: HM
      lang: en
      layout: post
      permalink: /en/posts/:year/:month/:day/:title/

  # ---- Categories ----------------------------------------------
  # One entry per category folder. The folder name is the slug of
  # the category, the visible name is set in _data/sitetext.yml.
  #
  # A new category needs three things:
  #   1. the folder _posts/<lang>/<category>
  #   2. an entry here, for both languages
  #   3. the visible name in _data/sitetext.yml
  #
  # A post can add categories of its own in the front matter. They
  # are merged with the category of the folder, the same way Jekyll
  # always merges categories.
  - scope:
      path: "_posts/fi/ai-strategy"
      type: "posts"
    values:
      categories: [ai-strategy]
  - scope:
      path: "_posts/en/ai-strategy"
      type: "posts"
    values:
      categories: [ai-strategy]
  - scope:
      path: "_posts/fi/leadership"
      type: "posts"
    values:
      categories: [leadership]
  - scope:
      path: "_posts/en/leadership"
      type: "posts"
    values:
      categories: [leadership]

languages:
  - code: fi
    label: Suomi
    text: Suomeksi
    url: /
    htmllang: fi_FI
    hreflang: fi-FI
    locale: fi-FI
  - code: en
    label: English
    text: In english
    url: /en/
    htmllang: en_US
    hreflang: en-US
    locale: en-US
