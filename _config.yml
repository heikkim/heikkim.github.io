# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

#theme: jekyll-agency
#remote_theme: raviriley/agency-jekyll-theme

DEBUG  : false

url    : "https://strongpointconsulting.fi" #"https://localhost:4000" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/" # the subpath of your site, e.g. /posts.
show_dir_listing: false

title      : "StrongPoint Consulting" # Also check _data/_sitetext.yml for what's visible on the page.
description: Fractional AI Leadership, AI coaching and AI consulting agency # This is used only if there is no specific description available for the page
email      : noreply@nop.nop #this is also the email contact forms will go to
author     : Heikki Malkamäki

analytics:
  google: G-5HZGV8ZNEF

markdown: kramdown

plugins:
  - "jekyll-sitemap"

exclude: [AGENTS.md, feed.xml]
include: [robots.txt, llms.txt, sitemap.xml]

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    #- global-builtin

# ==============================================================
#  Articles
#
#  Articles live in a two level folder structure:
#
#    _articles/<lang>/<category>/<slug>.md
#
#  - the first folder picks the language (fi = default, en)
#  - the second folder is the category, and its name is also the
#    category slug of the article
#
#  Articles are a Jekyll collection, not posts. The difference that
#  matters here is the date: it is not part of the file name and not
#  part of the URL. The publish date lives in the front matter as
#  "date" (ISO 8601, e.g. 2026-11-12T09:00:00+02:00). An article
#  dated in the future goes live on that day.
#
#  The defaults below read the language, the layout, the permalink
#  and the category of an article from its folder path. An article
#  can still override any of them in its own front matter.
#
#  The category slug and the file name are language neutral, so a
#  Finnish article and its English counterpart share the same URL
#  apart from the /en prefix. The language chooser relies on that.
# ==============================================================

collections:
  articles:
    output: true
    permalink: /articles/:categories/:title/

feed:
  excerpt_only: true
  posts_limit: 15
  collections:
    posts:
      path: null
    articles:
      path: "/feed.xml"



defaults:
  # ---- The default language of an article ----------------------
  - scope:
      path: ""
      type: "articles"
    values:
      author: HM
      lang: fi
      layout: post

  # ---- Finnish articles ---------------------------------------
  - scope:
      path: "_articles/fi"
      type: "articles"
    values:
      author: HM
      lang: fi
      layout: post
      permalink: /articles/:categories/:title/

  # ---- English articles ---------------------------------------
  - scope:
      path: "_articles/en"
      type: "articles"
    values:
      author: HM
      lang: en
      layout: post
      permalink: /en/articles/:categories/:title/

  # ---- Categories ----------------------------------------------
  # One entry per category folder. The folder name is the slug of
  # the category, the visible name is set in _data/sitetext.yml.
  #
  # A new category needs three things:
  #   1. the folder _articles/<lang>/<category>
  #   2. an entry here, for both languages
  #   3. the visible name in _data/sitetext.yml
  #
  # An article can add categories of its own in the front matter. They
  # are merged with the category of the folder, the same way Jekyll
  # always merges categories.
  - scope:
      path: "_articles/fi/ai-strategy"
      type: "articles"
    values:
      categories: [ai-strategy]
  - scope:
      path: "_articles/en/ai-strategy"
      type: "articles"
    values:
      categories: [ai-strategy]
  - scope:
      path: "_articles/fi/leadership"
      type: "articles"
    values:
      categories: [leadership]
  - scope:
      path: "_articles/en/leadership"
      type: "articles"
    values:
      categories: [leadership]

languages:
  - code: fi
    label: Suomi
    text: Suomeksi
    url: /
    htmllang: fi_FI
    hreflang: fi-FI
    locale: fi-FI
  - code: en
    label: English
    text: In English
    url: /en/
    htmllang: en_US
    hreflang: en-US
    locale: en-US
