{% comment %} The language of the page, resolved before the html tag is written {% endcomment %}
{% assign curlang = site.languages | where: "code", page.lang | first %}
<!DOCTYPE html>
<html lang="{{ curlang.locale | slice: 0,2 | default: "fi" }}">
  <!-- © 2026 StrongPoint Consulting. All rights reserved. -->
  {% include head.html %}

  <body id="page-top">

	{{ content }}

	{% include footer.html %}

	<!-- Cookie consent -->
	{% include cookie-consent.html %}

	<!-- Bootstrap core JavaScript -->
	<script src="/assets/js/jquery.min.js"></script>
	<script src="/assets/js/bootstrap.bundle.min.js"></script>

	<!-- Plugin JavaScript -->
	<script src="/assets/js/jquery.easing.min.js"></script>

	<!-- Contact form JavaScript -->
	<script src="/assets/js/jqBootstrapValidation.js"></script>
	<script src="/assets/js/contact_me.js"></script>

	<!-- Custom scripts for this template -->
	<script src="/assets/js/agency.js"></script>  

	<script src="/assets/js/spc.js"></script>
	<script src="/assets/js/spc-cookie-consent.js"></script>
	{% comment %} 
		<script src="/assets/js/c-anim.js"></script> 
	{% endcomment  %}

	<script>
		spc_init();
	</script>
  </body>
</html>
