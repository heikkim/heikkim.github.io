<head>
  {% if site.analytics.google %}
  {% if jekyll.environment == "production" %}
  <!-- Google Analytics is loaded only after the visitor has accepted analytics cookies -->
  <script>
    window.spcAnalyticsId = "{{ site.analytics.google }}";
  </script>
  {% endif %}
  {% endif %}

  <!-- The visitor preference cookie (consent, language, ...) -->
  <script src="/assets/js/spc-cookie.js"></script>
  <script src="/assets/js/spc-analytics.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="{{ page.meta_description | default: site.description }}" />
  <meta name="author" content="{{ site.author }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />

  <title>{% if page.meta_title %}{{ page.meta_title | append: " | " | append: site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.ico">

  <meta property="og:title" content="{% if page.meta_title %}{{ page.meta_title | append: " | " | append: site.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content={{ page.meta_description | default: site.description }}" />
  <meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}/assets/img/logo_300x300_bgblack.png{% endif %}" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Black+Ops+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <!-- Bootstrap core CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet" />

  <!-- Custom styles for this theme --> 
  <link href="/assets/css/agency.css" rel="stylesheet" />


  {% if page.layout == "post" or page.path contains "posts/index.md"%}
    <link href="/assets/css/posts-readability.css" rel="stylesheet" />
  {% endif %}
</head>
