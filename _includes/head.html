<head>
  {% if site.analytics.google %}
  <!-- Google Analytics is loaded only after the visitor has accepted analytics cookies -->
  <script>
    window.spcAnalyticsId = "{{ site.analytics.google }}";
  </script>
  {% endif %}

  <!-- The visitor preference cookie (consent, language, ...) -->
  <script src="/assets/js/spc-cookie.js"></script>
  <script src="/assets/js/spc-analytics.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="{{ page.meta_description | default: site.description }}" />
  <meta name="author" content="{{ site.author }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />

  <title>{% if page.meta_title %}{{ page.meta_title | append: " | " | append: site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Black+Ops+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <link rel="icon" href="/assets/img/favicon.png" />

  <!-- Bootstrap core CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet" />

  <!-- Custom styles for this theme --> 
  <link href="/assets/css/agency.css" rel="stylesheet" />

  {% comment  %} 
  {% if page.layout == "post" %}
  <link href="/assets/css/single-post.css" rel="stylesheet" />
  {% endif %}
   {% endcomment %}
</head>
