{% if logostyle == "" or logostyle == null %}
    {% assign logostyle = "brand" %}
{% endif %}

{% if logostyle == "brand" %}
    <div class="spc-logo">
        <span class="logo-text-S">S</span><span class="logo-text-P">P</span><span class="logo-text-C">C</span>
    </div>
{% elsif logostyle == "inline" %}
    <span class="spc-logo-inline"><span class="logo-text-S">S</span><span class="logo-text-P">P</span><span class="logo-text-C">C</span></span>
{% endif %}
