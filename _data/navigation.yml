#
# Work based on https://github.com/mmistakes/minimal-mistakes/blob/master/_data/ui-text.yml
#
# Configuration: Add to _config.yml
# locale: "en-US"  [YOUR PREFERRED LOCALE]
#
# How to use:
# {{ site.data.navigation[curlang.locale].nav.<var_name> | default: 'text' }}

# English (default)
# -----------------
en: &DEFAULT_EN
  nav:
    - title: "Services"
      section: services
      url: /#services
#    - title: "Portfolio"
#      section: portfolio
#    - title: "Timeline"
#      section: timeline
#    - title: "Team"
#      section: team
    - title: "Experience"
      section: about
      url: /#about
    - title: "Contact"
      section: contact # Check spc.js where this has a binding.
      url: /#contact
#    - title: "Theme Source"
#      url: https://github.com/raviriley/agency-jekyll-theme/
en-US:
  <<: *DEFAULT_EN
en-CA:
  <<: *DEFAULT_EN
en-GB:
  <<: *DEFAULT_EN
en-AU:
  <<: *DEFAULT_EN

