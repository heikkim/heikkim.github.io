fi: &DEFAULT_FI
  header:
    intro: "Käytännönläheistä tekoälykonsultointia, <span class=\"line\">viemään yrityksesi <span class=\"animated-keyword\">kärkipaikalle</span>.</span>"
    text: Kilpailuetua, parempaa tuottavuutta ja nopeampaa toimintaa johdolle, hallituksille ja yrityksille.
#    button: Palvelut
#    buttonlink: "#services"

  services:
    title: "Palvelut"
    text: ""
    section: services
    list:
      - sid: fractional-ai-lead
        title: "#1 Fractional AI Lead"
        brief: ""
        desc: >
          Toimiessani fractional AI Leadina, Directorina tai Officerina tarjoan yrityksille ja niiden hallituksille kokenutta strategianäkemystä, 
          hallintamalleja sekä muutoksen johtamista.
          <br /><br />
          Integroidun suoraan osaksi johtoryhmäänne. Autan määrittelemään, suunnittelemaan, koordinoimaan, käynnistämään ja ylläpitämään 
          yrityksen tekoälyhankkeiden vauhtia. Otan tarkasti huomioon yrityksenne kulttuurin ja toimintatavat.
        url: /services/fractional-ai-lead.html
        link-text: Lue lisää Fractional AI Lead palvelusta yrityksille
      - sid: ai-coaching
        title: "#2 AI-valmennus"
        brief: ""
        desc: >
          Tekoälyn nopeaan haltuunottoon, tehokkaaseen kehotemuotoiluun (promptaukseen) ja jokapäiväisten automaatioiden rakentamiseen käytännönläheisesti.
          Valmennuksen painopisteenä on löytää, mikä tuo konkreettista arvoa työpäivääsi juuri nyt.
          <br /><br />
          Jos käytät jo tekoälyä päivittäin: Opi ChatGPT-tehokäyttäjäksi, joka hyödyntää tekoälyä strategiatyössä sekä agenteja
          monimutkaisemmissa tehtävissä agenttitaitojen (Agent Skills) avulla.
        url: /services/ai-coaching.html
        link-text: Lue lisää johdon ja hallituksen AI-valmennuksesta
      - sid: ai-consulting
        title: "#3 AI-konsultointi"
        brief: ""
        desc: >
          Yrityksen tekoälymahdollisuuksien ymmärtämiseen, tekoälymuutoksen toteutussuunnitelman luomiseen tai tietyn tekoälyn ja datan tehokkaaseen käyttöön liittyvän 
          haasteen ratkaisemiseen.
          <br /><br />
          Ulkopuolisen asiantuntijanäkemyksen saamiseen yrityksen tekoälyn käyttöön liittyvään asiaan.
        url: /services/ai-consulting.html
        link-text: Lue lisää tekoälykonsultoinnista yrityksille ja organisaatioille
  
  about:
    title: Käytännön kokemusta tuloksekkaaseen johtamiseen
    text: Palvelen PK-yrityksiä AI Leadina fractional-mallilla. Teen myös johdon AI-valmennuksia ja AI-konsultointeja yritysten täsmätarpeisiin.
    body: >
      Minulla on 20 vuoden kokemus IT-konsultointi- ja softakehitys-liiketoiminnasta sekä SaaS-liiketoiminnasta.
      Urallani olen toiminut toimitusjohtajana, käynnistänyt data- ja AI-osaamiseen perustuvia liiketoimintoja sekä johtanut tuote- ja teknologiakehitystä.
      Erityisosaamistani johtamisen ohella ovat data- ja tekoälyosaamista vaativat hankkeet, sekä toiminta vahvasti reguloiduissa tietointensiivisissä ympäristöissä.
      <br /><br />
      Toimin nopeasti, otan omistajuuden hankkeen edistämisestä ryhdikkäästi ja määrätietoisesti. Yrityksenne tarpeista ja tavoitteista lähtemällä muodostamme 
      toiminta- ja investointi-suunnitelman mittaristoineen. Fractional-malli mahdollistaa asiakkailleni kustannustehokkaan ja riskittömän tavan saada johtoryhmään mukaan 
      kokenut ulkopuolinen johtaja.
      <br /><br />
      Viimeisin kolutukseni on Aalto Executive Educationin MBA (2022), josta valmistuin erinomaisin arvosanoin.
      <br />
      Nopea ajantasalle pääsy ja rivakka startti taattu.
      <br /><br />
      <strong>Heikki Malkamäki</strong>
    linkedin-url: https://www.linkedin.com/in/heikkim/
    linkedin-link-text: Profiili
    section: about

  wayforward:
    title: Selkeydellä hankkeissa eteenpäin
    contentlist:
      - header: Kartoitus
        body: Käymme lyhyen keskustelun, jossa käsitellään tavoiteltavat tulokset, mahdolliset esteet ja aiemmat kokeilut.
      - header: Määritelmä
        body: Yhteisymmärrys ongelman ytimestä sekä sovimme selkeät mittarit sille, miltä onnistunut lopputulos näyttää.
      - header: Ratkaisu
        body: Laadin selkeän ehdotuksen, joka vastaa suoraan kipupisteisiin ja johtaa ongelman ratkaisuun.
      - header: Toteutus
        body: Käynnistämme yhteistyön reippaasti ja etenemme hallituin askelmerkein. Muutamme suunnitelmaa tarvittaessa.
      

