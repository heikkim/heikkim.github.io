en: &DEFAULT_EN
  header:
    intro: "A hands-on AI consultancy<br />for your company to get <span class=\"animated-keyword\">ahead</span>."
    text: "Competitive edge, uplifted productivity & accelerated operations for senior business leaders, boards and companies."
#    button: Services
#    buttonlink: "#services"

  services:
    title: "Services"
    text: ""
    section: services
    list:
      - sid: fractional-ai-leadership
        title: "#1 Fractional AI Leadership"
        brief: ""
        desc: >
          Senior leadership engagement providing companies and their boards with senior strategy, governance, and hands-on execution.
          The role is typically one of AI Director, Head of AI, Chief AI Officer depending on the company's lineup of roles and situation.
          <br /><br />
          Integrating directly with your management team to help you define, plan, coordinate, initiate and maintain momentum of your company's AI initiative, at scale.
        url: /en/services/fractional-ai-leadership.html
        link-text: Read more about Fractional AI Leadership
        faq:
          - question: "What does Fractional mean, and why should I be interested?"
            answer: >-
              A fractional leader works with your company part-time for an agreed period, acting as an interim leader. The key advantages of the fractional model are eliminating hiring risks and delivering fast results.
          - question: "How is this different from hiring a full-time AI leader?"
            answer: >-
              A full-time hire is a fixed cost that starts before the benefits are measurable. In the
              fractional model the capacity is set to what is needed now, from 1+ days per week upwards,
              and it can be adjusted as the situation changes. The way of working is the same as with
              a full-time leader: in the management team, in the decisions and in the delivery.
          - question: "What does the Fractional AI Leader do?"
            answer: >-
              Fractional AI Leader takes full responsibility of the AI transformation agenda in the company. This includes, but is not limited to:
              maps out the current situation, creates an AI transformation roadmap tailored for the company by taking account company's AI maturity level, identifying change champions and enabling them to spread the word, arranges workshops and information sharing sessions.
              AI Leader is accountable for the CEO or other top management team member depending on the organisation, keeps them informed at all times and ensures the AI agenda is moving forward.
          - question: "What is the recommended length of a commitment?"
            answer: >-
              Upwards from at least 3 months is advisable for 4+ days a week commitments. A longer timeframe for lesser days a week commitments.
              It is important to give enough time for the change to get traction.
          - question: "What if the AI initiative fails?"
            answer: >-
              The AI initiative is taken forward with utmost care and responsibility. The initial right scoping of the initiative and creating correct metrics are very important and ensure success best.
              You will at all times be well informed about the situation. In case the mutually agreed metrics are not developing to the right direction, we will know why it is so and decide accordingly.
              There is almost always a solution.
          - question: "How does the engagement end?"
            answer: >-
              The collaboration is reviewed periodically and after the first month there is a 30-day
              notice period. The collaboration continues as long as the customer has a need.
      - sid: ai-coaching
        title: "#2 AI Coaching"
        brief: ""
        desc: >
          1-to-1 coaching for getting quickly up-to-date on AI, effective prompting and building everyday automations hands-on.
          Immediate focus will be on discovering what creates value for your work day right now.
          <br /><br />
          In case you're already using AI daily: Learn how to be a power user who uses AI for strategising and agents for more complex tasks 
          utilising Agent Skills.
        url: /en/services/ai-coaching.html
        link-text: Read more about AI Coaching
        faq:
          - question: "Who is the coaching for?"
            answer: >-
              For leaders and board members who want to get the most out of AI. The programme is personal rather than course-like, and is focused on your own work.
          - question: "How long does the coaching take?"
            answer: >-
              A typical programme runs 1 to 4 weeks. After the discovery call one programme is agreed
              for the whole period.
          - question: "What do I keep afterwards?"
            answer: >-
              Everything we build together: your own prompt library, the automations, the agents and
              a documented AI operating manual.
          - question: "Is this just learning the tools?"
            answer: >-
              No. The tools change every few months, the work does not. In the coaching you build
              your own way of working with AI as a part of the day: the first automation, then the
              next one, and finally an agent that takes care of repetitive work for you.
          - question: "How does the coaching start?"
            answer: >-
              The first session maps the work that repeats daily and carries value, such as email,
              customer feedback and reporting. After that the effort goes where the pressure is highest.
#      - sid: ai-tooling
#        title: "AI Tooling"
#        brief: ""
#        desc:           
#        url: /en/services/ai-tooling.html
#        link-text: Read more about AI Tooling for Teams and Organisations
      - sid: ai-consulting
        title: "#3 AI Consulting"
        brief: ""
        desc: >
          For understanding AI opportunities in the company, creating an execution plan for AI change, 
          or in solving a specific challenge related to effective use of AI / data in the company.
          <br /><br />
          Any matter related to company AI use which benefits having an external view.
        url: /en/services/ai-consulting.html
        link-text: Read more about AI Consulting
        faq:
          - question: "Where do we need AI Consulting?"
            answer: >-
              Companies usually struggle in one flavor of these: getting AI transformation moving, identifying AI use cases, deciding on an AI investment or just in having a facilitated workshop pulling all opinions together in a structured manner.
              The scope is agreed in writing before the work starts.
          - question: "When do we need an outside view?"
            answer: >-
              When the company is too close to the problem to see it clearly, or when there is an AI
              investment that deserves a second pair of eyes before a "GO". An expert outside view also helps scrutinize an idea or concept.
          - question: "How long does a project take?"
            answer: >-
              Usually from a few weeks to a few months. The short form is a workshop or an assessment,
              the long form an implementation plan that continues into production.
          - question: "How do you make sure the work stays with us?"
            answer: >-
              The documentation, the practices and the training stay with you. The work continues without a
              break when the consulting assignment ends.
          - question: "How does an AI consulting assignment start?"
            answer: >-
              Understanding the problem first, not throwing AI tools ot it. First it is settled what problem is being
              solved and what affects the outcome. Then an experiment is designed that raises the odds of
              success, and the implementation is done in a controlled way with regular measuring.
#      - sid: agentic-ai
#        title: "Agentic AI"
#        brief: ""
#        desc: >
#          Autonomous business agents built on mainstream AI models are the new normal. Lack of time and knowhow is a limiting factor
#          for most companies. Choosing the right tasks to do, or getting around LLM quirks is a serious time consumer most companies want to skip. I can help you build 
#          automations that take your business processes into account, are well defined and actually deliver. This service is when you want to take advantage of agentic automation potential, 
#          while focusing on your business.
#        url: /en/services/agentic-ai.html
#        link-text: Read more about Agentic AI services for Teams & Organisations

