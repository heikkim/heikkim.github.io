    - question: "Miten yhteistyö alkaa?"
      answer: >-
        Lyhyellä kartoituskeskustelulla, jossa käydään läpi nykytila, mitä on kokeiltu,
        missä ollaan jumissa ja miltä onnistuminen näyttäisi. Keskustelu ei sido mihinkään.
        Helpoiten meihin yhteyden saat sivun alaosasta löytyvällä yhteydenottolomakkeella.
    - question: "Mikä palvelu on oikea minulle tai yritykselleni?"
      answer: >-
        Yrityksen tekoälymuutos tarvitsee omistajan ja jatkuvuutta, tällöin oikea on <a href="/services/fractional-ai-leadership.html" class="content-link">Fractional AI Leadership</a><br />
        Kehittyminen tekoälyn tehokäyttäjäksi onnistuu <a href="/services/ai-coaching.html" class="content-link">AI-valmennuksella</a><br /> 
        Strategian kirkastaminen, yksittäiset data- ja tekoälyongelmat, workshoppien järjestäminen ja koulutukset ratkeavat <a href="/services/ai-consulting.html" class="content-link">AI-konsultoinnilla</a><br />
        Kartoituskeskustelu ratkaisee asian. Kerromme myös jos mikään palveluistamme ei sovellu.
    - question: "Mitä Fractional tarkoittaa ja miksi pitäisi olla kiinnostunut?"
      answer: >-
        Fractional-mallilla toimiva johtaja toimii yrityksessä osa-aikaisena ja vain sovitun ajan, ollen ns. vuokrajohtaja. Fractional-mallin etu on rekrytointiin liittyvien riskien eliminointi ja nopeat tulokset.
    - question: "Mihin tekoälyä kannattaa käyttää?"
      answer: >-
        Paras kohde ovat toistuvat työtehtävät, joissa ihminen kykenee helposti tunnistamaan onko lopputulos hyvä vai huono. Hyviä käyttötapauksia ovat esim. asiakaspalautteiden analysointi, sisällön tarkastaminen, asioiden luokittelu ja tekstin tiivistäminen & luonnostelu.
    - question: "Mitkä tehtävät jäävät ihmiselle?"
      answer: >-
        Ihmisen tulee ohjata tekoälyä ja tehdä päätökset. Myöskin oikeiden toimenpidevaihtoehtojen valinta ja määrittäminen on toistaiseksi ihmisen tehtävä.
    - question: "Teettekö myös toteutuksia?"
      answer: >-
        Meillä on luotettujen kumppanien verkosto, jonka kautta pystymme toteuttamaan teknisiä ja konsultatiivisia toimeksiantoja.

  about:
    title: Käytännön kokemusta tuloksekkaaseen johtamiseen
    text: Palvelen PK-yrityksiä AI Leaderina fractional-mallilla. Teen myös johdon AI-valmen&shy;nuksia ja AI-konsul&shy;tointeja yritysten täsmä&shy;tarpeisiin.
    body: >
      Minulla on 20 vuoden kokemus IT-konsultointi- ja ohjelmisto&shy;kehitysliike&shy;toiminnasta sekä SaaS-liike&shy;toiminnasta.
      Urallani olen toiminut toimitus&shy;johtajana, käynnistänyt data- ja AI-osaamiseen perustuvia liike&shy;toimintoja sekä johtanut tuote- ja teknologia&shy;kehitystä.
      Erityis&shy;osaamistani johtamisen ohella ovat data- ja tekoäly&shy;osaamista vaativat hankkeet, sekä toiminta vahvasti reguloidussa tieto&shy;intensii&shy;visessä ympäristössä.
      <br /><br />
      Toimin nopeasti, ottamalla omistajuuden hankkeen edistämisestä ryhdikkäästi ja määrätietoisesti. Yrityksenne tarpeista ja tavoitteista lähtemällä muodostamme 
      toiminta- ja investointi&shy;suunnitelman mittaris&shy;toineen. Fractional-malli mahdollistaa asiakkailleni kustannus&shy;tehokkaan ja riskittömän tavan saada johtoryhmään mukaan 
      kokenut ulkopuolinen johtaja.
      <br /><br />
      Viimeisin koulutukseni on Aalto Executive Educationin MBA (2022), josta valmistuin erinomaisin arvosanoin.
      <br />
      Nopea ajantasalle pääsy ja rivakka startti taattu.
      <br /><br />
      <strong>Heikki Malkamäki</strong>
    linkedin-url: https://www.linkedin.com/in/heikkim/
    linkedin-link-text: Profiili
    section: about

