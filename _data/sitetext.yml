          By integrating directly with your 
          management team I help you define, plan, coordinate, initiate and maintain momentum of your company's AI initiative, at scale.
        url: /en/services/fractional-ai-lead.html
        link-text: Read more about Fractional AI Lead for Companies
      - sid: ai-coaching
        title: "#2 AI Coaching"
        brief: ""
