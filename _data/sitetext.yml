  about:
    title: "Real experience for getting real results"
    text: I serve SME companies as an AI Lead on a fractional basis. I also provide executive AI coaching and targeted AI consulting tailored to specific company needs.
    body: >
      I have 20 years of experience in IT consulting, software development, and SaaS business. I have served as a CEO, established 
      new business operations centered on data and artificial intelligence expertise and led product & technology development. In addition to leadership skills, my core 
      specialization lies in customer initiatives requiring data and AI capabilities, as well as working in highly regulated, information-intensive environments.
      <br /><br />
      I move fast, take ownership, and drive initiatives with clarity and commitment. In everything I do, I respect and adapt to your company's culture and 
      operational style. The fractional model gives my clients a cost-effective, risk-free way to bring an experienced executive into their leadership team.
      <br /><br />
      I hold an MBA from Aalto Executive Education (2022), graduated with honors. 
      <br /> 
      Hitting the ground running guaranteed.
      <br /><br />
      <strong>Heikki Malkamäki</strong>
    linkedin-url: https://www.linkedin.com/in/heikkim/
    linkedin-link-text: Profile
    section: about

  wayforward:
    title: A clear path forward
    contentlist:
      - header: Discovery
        body: A brief conversation to cover targeted outcomes, potential roadblocks, and previous attempts.
      - header: Definition
        body: Alignment on the root problem and clear metrics defining what a successful outcome looks like.
      - header: Solution
        body: A clear proposal tailored directly to your pain points and structured to solve the core issue.
      - header: Execution
        body: Rapid project kickoff with measured, step-by-step progress, adapting the plan as needed.

