fi: &DEFAULT_FI
  header:
    intro: "Käytännönläheistä tekoälykonsultointia, <span class=\"line\">viemään yrityksesi <span class=\"animated-keyword\">kärkipaikalle</span>.</span>"
    text: Kilpailuetua, parempaa tuottavuutta ja nopeampaa toimintaa johdolle, hallituksille ja yrityksille.
#    button: Palvelut
#    buttonlink: "#services"

  services:
    title: "Palvelut"
    text: ""
    section: services
    list:
      - sid: fractional-ai-leadership
        title: "#1 Fractional AI Leadership"
        brief: ""
        desc: >
          Kokenut johtaja suoraviivaisesti mukaan johtoryhmään. Kokenutta strategianäkemystä, AI-käytäntöjä sekä muutoksen johtamista yrityksille ja 
          yritysten hallituksille. Rooli on tyypillisesti AI Director, Head of AI tai Chief AI Officer yrityksen roolituksesta ja tilanteesta riippuen.
          <br /><br />
          Toimien tiiviinä osana johtoryhmää, AI Leader auttaa määrittelemään, suunnittelemaan, koordinoimaan, käynnistämään ja ylläpitämään 
          yrityksen tekoälyhankkeiden vauhtia, samalla huomioiden yrityksen kulttuurin ja yksilölliset toimintatavat.
        url: /services/fractional-ai-leadership.html
        link-text: Lue lisää Fractional AI Leadership palvelusta
        faq:
          - question: "Mitä Fractional tarkoittaa ja miksi pitäisi olla kiinnostunut?"
            answer: >-
              Fractional-mallilla toimiva johtaja toimii yrityksessä osa-aikaisena ja vain sovitun ajan, ollen ns. vuokrajohtaja. Fractional-mallin etu on rekrytointiin liittyvien riskien eliminointi ja nopeat tulokset.
          - question: "Miten tämä eroaa kokoaikaisen tekoälyjohtajan palkkaamisesta?"
            answer: >-
              Kokoaikainen rekrytointi on kiinteä kustannus, joka alkaa juosta ennen kuin hyödyt ovat mitattavissa.
              Fractional-mallissa kapasiteetti mitoitetaan nykyhetken tarpeen mukaan, alkaen 1+ päivästä viikossa ylöspäin,
              ja sitä voidaan säätää joustavasti tilanteen muuttuessa. Työskentelytapa on sama, kuin
              kokoaikaisella johtajalla: mukana johtoryhmässä, päätöksenteossa ja käytännön läpiviennissä.
          - question: "Mitä Fractional AI Leader tekee?"
            answer: >-
              Fractional AI Leader ottaa kokonaisvastuun yrityksen tekoälymuutoksen läpiviennistä. Tehtäviin kuuluu muun muassa
              nykytilan kartoitus, yrityksen tekoälykypsyystason huomioivan tiekartan laatiminen, muutosta ajavien työntekijöiden tunnistaminen ja auttaminen viemään viestiä eteenpäin sekä työpajojen ja tiedonjakotilaisuuksien järjestäminen.
              AI Leader raportoi organisaatiosta riippuen suoraan toimitusjohtajalle tai muulle johtoryhmän jäsenelle, pitää johdon jatkuvasti ajan tasalla ja varmistaa, että tekoälyagenda etenee suunnitellusti.
          - question: "Mikä on suositeltu kesto yhteistyölle?"
            answer: >-
              Vähintään kolmen kuukauden jakso on suositeltava, kun panostus on vähintään neljä päivää viikossa. Pienemmällä viikkopanoksella suositeltava aikajänne on pidempi.
              Muutokselle on tärkeää antaa riittävästi aikaa saada jalansijaa.
          - question: "Entä jos tekoälyhanke epäonnistuu?"
            answer: >-
              Tekoälyhanketta viedään eteenpäin huolella ja vastuullisesti. Hankkeen oikea rajaus heti alussa sekä tarkoituksenmukaisten mittareiden asettaminen ovat ratkaisevia tekijöitä onnistumiselle.
              Pysyt koko ajan täysin ajan tasalla tilanteesta. Jos yhdessä sovitut mittarit eivät kehity oikeaan suuntaan, selvitämme syyt ja teemme tarvittavat päätökset sen mukaisesti.
              Ratkaisu löytyy lähes aina.
          - question: "Miten yhteistyö päättyy?"
            answer: >-
              Yhteistyön etenemistä arvioidaan säännöllisesti, ja ensimmäisen kuukauden jälkeen on 30 päivän
              irtisanomisaika. Yhteistyö jatkuu niin kauan kuin asiakkaalla on sille tarve.
      - sid: ai-coaching
        title: "#2 AI-valmennus"
        brief: ""
        desc: >
          Tekoälyn nopeaan haltuunottoon, tehokkaaseen kehotemuotoiluun (promptaukseen) ja jokapäiväisten automaatioiden rakentamiseen käytännönläheisesti.
          Valmennuksen painopisteenä on löytää, mikä tuo konkreettista arvoa työpäivääsi juuri nyt.
          <br /><br />
          Jos käytät jo tekoälyä päivittäin: Opi ChatGPT-tehokäyttäjäksi, joka hyödyntää tekoälyä strategiatyössä sekä agenteja
          monimutkaisemmissa tehtävissä agenttitaitojen (Agent Skills) avulla.
        url: /services/ai-coaching.html
        link-text: Lue lisää johdon AI-valmennuksesta
        faq:
          - question: "Kenelle valmennus on tarkoitettu?"
            answer: >-
              Johtajille ja hallitusjäsenille, jotka haluavat ottaa AI:sta kaiken irti. 
              Ohjelma on henkilökohtainen, ja lähtökohtana on
              oma työsi, ei yleinen teoriatieto.
          - question: "Miten kauan valmennus kestää?"
            answer: >-
              Tyypillinen ohjelma on 1-4 viikkoa. Ohjelman pituus sovitaan kartoituskeskustelun jälkeen
              koko jaksolle.
          - question: "Mitä minulle jää käteen tästä?"
            answer: >-
              Kaikki, mitä yhdessä rakennamme: oma kehotekirjasto, automaatiot, agentit ja
              dokumentoitu AI-käsikirja.
          - question: "Onko tämä vain työkalujen opettelua?"
            answer: >-
              Ei. Työkalut muuttuvat jatkuvasti, työ ei. Valmennuksessa rakennetaan
              oma tapa työskennellä tekoälyn kanssa: ensin ensimmäinen automaatio, sitten seuraava ja
              lopuksi agentti hoitamaan toistuvaa työtä puolestasi.
          - question: "Miten valmennus alkaa?"
            answer: >-
              Ensimmäisessä sessiossa kartoitamme päivittäin toistuvan työn, esimerkiksi
              sähköpostit, asiakaspalautteet ja raportoinnin. Sen jälkeen aika käytetään automatisoimaan tehtäviä, missä
              saadaan paras panostus-tuottosuhde.
      - sid: ai-consulting
        title: "#3 AI-konsultointi"
        brief: ""
        desc: >
          Yrityksen tekoälymahdollisuuksien ymmärtämiseen, tekoälymuutoksen toteutussuunnitelman luomiseen tai tietyn tekoälyn ja datan tehokkaaseen käyttöön liittyvän 
          haasteen ratkaisemiseen.
          <br /><br />
          Ulkopuolisen asiantuntijanäkemyksen saamiseen yrityksen tekoälyn käyttöön liittyvään asiaan. Fasilitoidut workshopit ja tekoälykoulutukset.
        url: /services/ai-consulting.html
        link-text: Lue lisää tekoälykonsultoinnista
        faq:
          - question: "Missä tilanteissa tarvitsemme AI-konsultointia?"
            answer: >-
              Yritykset painivat tyypillisesti jonkin haasteen kanssa, kuten: tekoälymuutoksen saaminen liikkeelle, tekoälyn käyttökohteiden tunnistaminen, päätöksenteko tekoälyinvestoinnista tai tarve fasilitoidulle työpajalle, joka kokoaa eri näkemykset yhteen jäsennellysti.
              Työn laajuus sovitaan kirjallisesti ennen aloitusta.
          - question: "Milloin tarvitsemme ulkopuolista näkemystä?"
            answer: >-
              Toisinaan yritys on liian lähellä ongelmaa nähdäkseen sen kirkkaasti, tai kun aikeissa on tekoälyinvestointi, joka kaipaa konsulttiarviota ennen aloituspäätöstä. Ulkopuolinen asiantuntijanäkemys auttaa myös haastamaan ja arvioimaan uutta ideaa tai konseptia kriittisesti.
          - question: "Kuinka kauan projekti kestää?"
            answer: >-
              Muutamasta viikosta muutamaan kuukauteen. Lyhimmillään kyseessä on yksittäinen työpaja tai nykytila-arvio, laajimmillaan toteutussuunnitelma, joka viedään tuotantoon asti.
          - question: "Miten varmistatte, että työ ja tulokset jäävät meille?"
            answer: >-
              Kaikki työ dokumentoidaan huolellisesti. Työ jatkuu saumattomasti ilman katkoksia toimeksiannon päätyttyä.
          - question: "Miten AI-konsultointihanke lähtee liikkeelle?"
            answer: >-
              Aloitamme ongelman ymmärtämisestä. Tekoälytyökalujen käyttöönottosuositukset tulevat myöhemmin perustellusti. Aluksi määritetään ratkaistava ongelma ja mitkä tekijät vaikuttavat lopputulokseen. Sen jälkeen suunnitellaan kokeilu, joka lisää onnistumisen todennäköisyyttä. 
              Toteutus viedään hallitusti ja säännöllisesti mittaamalla läpi.

