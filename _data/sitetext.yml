  service-cta:
    title: "Take the next step."
    text: "Every engagement starts with a brief, no-commitment discovery call to map your current situation: what you have tried, what is stuck, and what success would look like."
    cta: "Start a Conversation"

  # The header of a FAQ block. The questions of a service are in the faq of
  # the service and the questions of the home page are in the general faq.
  faq:
    title: "Frequently asked questions"
    text: 

  # The general FAQ of the home page: the most important questions across the services
  genfaq:
    - question: "How do we get started?"
      answer: >-
        The first conversation is short and without commitment. We go through your current situation,
        what you have tried, what is stuck and what success would look like. Best way to reach us is via our contact form at the bottom of the page.
    - question: "Which service is right for me or my company?"
      answer: >-
        A company's AI transformation needs a dedicated owner and continuity, therefore the right fit is <a href="/en/services/fractional-ai-leadership.html" class="content-link">Fractional AI Leadership</a><br />
        Becoming an AI power user happens through <a href="/en/services/ai-coaching.html" class="content-link">AI Coaching</a><br /> 
        Sharpening your strategy, solving specific data and AI challenges, and running workshops or trainings are covered by <a href="/en/services/ai-consulting.html" class="content-link">AI Consulting</a><br />
        A discovery call will clarify the best path forward. We will also tell you if none of our services are the right fit at this time.
    - question: "What does Fractional mean, and why should I be interested?"
      answer: >-
        A fractional leader works with your company part-time for an agreed period, acting as an interim leader. The key advantages of the fractional model are eliminating hiring risks and delivering fast results.
    - question: "What should AI be used for?"
      answer: >-
        The best targets are repetitive tasks where a person can easily tell whether the output is good or bad. Strong use cases include analyzing customer feedback, reviewing content, categorizing information, and summarizing or drafting text.
    - question: "Which tasks remain for humans?"
      answer: >-
        Humans need to direct the AI and make the decisions. Defining and selecting the right courses of action also remains a human responsibility for now.
    - question: "Do you also handle implementation?"
      answer: >-
        We have a network of trusted partners through which we can deliver both technical and consultative engagements.

  about:
    title: "Real experience for getting real results"
    text: Serving SME companies as an AI Leader on a fractional basis. I also provide executive AI coaching and targeted AI consulting tailored to specific company needs.
    body: >
      20 years of experience in IT consulting, software development, and SaaS business. I have served as a CEO, established 
      new business operations centered on data and artificial intelligence expertise and led product & technology development. In addition to leadership skills, my core 
      specialization lies in customer initiatives requiring data and AI capabilities, as well as working in highly regulated, information-intensive environments.
      <br /><br />
      I move fast, take ownership, and drive initiatives with clarity and commitment. Respect and adaptation to your company's culture and 
      operational style is visible in every step of the way. The fractional model enables clients a cost-effective, risk-free way to bring an experienced executive into their leadership team.
      <br /><br />
      I hold an MBA from Aalto Executive Education (2022), graduated with honors. 
      <br /> 
      Hitting the ground running guaranteed.
      <br /><br />
      <strong>Heikki Malkamäki</strong>
    linkedin-url: https://www.linkedin.com/in/heikkim/
    linkedin-link-text: Profile
    section: about

  wayforward:
    title: A clear path forward
    contentlist:
      - header: Discovery
        body: A brief conversation to cover targeted outcomes, potential roadblocks, and previous attempts.
      - header: Definition
        body: Alignment on the root problem and clear metrics defining what a successful outcome looks like.
      - header: Solution
        body: A clear proposal tailored directly to your pain points and structured to solve the core issue.
      - header: Execution
        body: Rapid project kickoff with measured, step-by-step progress, adapting the plan as needed.

